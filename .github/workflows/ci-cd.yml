name: Hackathon Tracker CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: '20'

jobs:
  # ──────────────────────────────────────────
  # JOB 1: Backend CI
  # ──────────────────────────────────────────
  backend:
    name: 🛠️ Backend – Install & Lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install backend dependencies
        run: npm ci

      - name: 🔍 Run backend lint (if configured)
        run: npm run lint --if-present

      - name: 🧪 Run backend tests (if configured)
        run: npm test --if-present
        env:
          NODE_ENV: test
          # Add your backend secrets here as GitHub Secrets:
          # JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # MONGODB_URI: ${{ secrets.MONGODB_URI }}

  # ──────────────────────────────────────────
  # JOB 2: Frontend CI
  # ──────────────────────────────────────────
  frontend:
    name: 🎨 Frontend – Install, Lint & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install frontend dependencies
        run: npm ci

      - name: 🔍 Run frontend lint (if configured)
        run: npm run lint --if-present

      - name: 🏗️ Build frontend
        run: npm run build
        env:
          # Add your frontend env vars here as GitHub Secrets:
          # VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: 📤 Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ──────────────────────────────────────────
  # JOB 3: Deploy (only on push to main/master)
  # ──────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to EC2
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "=== Pulling latest code ==="
            cd ~/Hackathon-Tracker
            git pull origin main

            echo "=== Installing backend dependencies ==="
            cd backend
            npm ci --production

            echo "=== Restarting backend with PM2 ==="
            pm2 restart hackathon-backend || pm2 start server.js --name hackathon-backend

            echo "=== Installing & building frontend ==="
            cd ../frontend
            npm ci
            npm run build

            echo "=== Deployment complete! ==="
